# ============================================================
#  MambaIRv2 — Old Portrait Photo Restoration
#  Exp-A: Baseline（纯 L1，不加 face loss）
# ============================================================

name: MambaIRv2_OldPortrait
model_type: MambaIRv2Model
scale: 1
num_gpu: 1
manual_seed: 0

# ── 数据集 ────────────────────────────────────────────────────
datasets:
  train:
    name: OldPortrait_Train
    type: PairedImageDataset
    dataroot_gt: /root/autodl-tmp/MambaIR/my-test/data/old_portrait/train/HQ
    dataroot_lq: /root/autodl-tmp/MambaIR/my-test/data/old_portrait/train/LQ
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 64
    use_hflip: true
    use_rot: false

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: OldPortrait_Val
    type: PairedImageDataset
    dataroot_gt: /root/autodl-tmp/MambaIR/my-test/data/old_portrait/val/HQ
    dataroot_lq: /root/autodl-tmp/MambaIR/my-test/data/old_portrait/val/LQ
    io_backend:
      type: disk

# ── 网络结构（与官方 ColorDN 配置一致）─────────────────────────
network_g:
  type: MambaIRv2
  upscale: 1
  in_chans: 3
  img_size: 128
  img_range: 1.
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.
  upsampler: ''
  resi_connection: '1conv'

# ── 权重路径 ──────────────────────────────────────────────────
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# ── 训练设置 ──────────────────────────────────────────────────
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [100000, 160000, 180000, 190000]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1
  use_grad_clip: true
  grad_clip_norm: 0.01

  # Baseline：只用 L1 loss
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# ── 验证 ──────────────────────────────────────────────────────
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# ── 日志 ──────────────────────────────────────────────────────
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
