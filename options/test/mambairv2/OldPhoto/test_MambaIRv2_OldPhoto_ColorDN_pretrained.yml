# 【NICOLE2026】ColorDN 零样本基线：原始去噪预训练模型不微调，直接测我们的 2000 张老照片测试集
# 这是"现成模型直接用"的真实起点：LQ -> ColorDN(zero-shot) -> A0(微调) -> A1 -> A2 -> v2
# 它说明为什么需要场景微调（预期在老照片上表现差，远不如各微调臂）。
name: test_MambaIRv2_OldPhoto_ColorDN_pretrained
model_type: MambaIRv2Model
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  test_1:
    name: FFHQ_OldPhoto_Test
    type: PairedImageDataset
    dataroot_gt: /root/autodl-tmp/MambaIR/datasets/FFHQ_pair/test/HQ
    dataroot_lq: /root/autodl-tmp/MambaIR/datasets/FFHQ_pair/test/LQ
    dataroot_face_weight: /root/autodl-tmp/MambaIR/datasets/FFHQ_pair/test/face_weight
    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures —— 必须是 ColorDN 原始结构（use_heb: false，与 A0/A1/A2 同结构）
network_g:
  type: MambaIRv2
  use_heb: false
  upscale: 1
  in_chans: 3
  img_size: 128
  img_range: 1.
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.
  upsampler: ''
  resi_connection: '1conv'

path:
  pretrain_network_g: /root/autodl-tmp/MambaIR/pretrained/mambairv2_ColorDN_15.pth
  strict_load_g: true
  param_key_g: params       # 原始 ColorDN 权重存在 'params'（非 params_ema；微调臂才用 params_ema）

val:
  save_img: false           # 只算指标；要定性图改 true
  suffix: ~
  selfensemble_testing: false
  patchwise_testing: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    face_psnr:
      type: calculate_face_psnr
      better: higher
      crop_border: 0
      test_y_channel: false
      mask_threshold: 1
    face_ssim:
      type: calculate_face_ssim
      better: higher
      crop_border: 0
      test_y_channel: false
      mask_threshold: 1
    lpips:
      type: calculate_lpips
      better: lower
      crop_border: 0
      net: vgg
# 【NICOLE2026】
