# 【NICOLE2026】v2/A3 测试：Charbonnier + Sobel + FFL + HEB（全家桶），完整 2000 张测试集
# 注意 network_g.use_heb 必须为 true 且 HEB 结构参数与训练一致，否则加载 heb.alpha 失败
name: test_MambaIRv2_OldPhoto_v2
model_type: MambaIRv2Model
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  test_1:
    name: FFHQ_OldPhoto_Test
    type: PairedImageDataset
    dataroot_gt: /root/autodl-tmp/MambaIR/datasets/FFHQ_pair/test/HQ
    dataroot_lq: /root/autodl-tmp/MambaIR/datasets/FFHQ_pair/test/LQ
    dataroot_face_weight: /root/autodl-tmp/MambaIR/datasets/FFHQ_pair/test/face_weight
    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures —— v2 开 HEB，结构参数与训练严格一致
network_g:
  type: MambaIRv2
  use_heb: true
  heb_init: 0.1             # 测试时无所谓（alpha 由 checkpoint 加载覆盖），保持与训练一致
  heb_channel_wise: true   # 必须与训练一致（决定 alpha 形状）
  heb_blur_kernel: 5       # 必须与训练一致（决定 blur 核）
  upscale: 1
  in_chans: 3
  img_size: 128
  img_range: 1.
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.
  upsampler: ''
  resi_connection: '1conv'

path:
  pretrain_network_g: /root/autodl-tmp/MambaIR/experiments/MambaIRv2_OldPhoto_NICOLE_v2_30k/models/net_g_latest.pth
  strict_load_g: true
  param_key_g: params_ema

val:
  save_img: true
  suffix: ~
  selfensemble_testing: false
  patchwise_testing: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    face_psnr:
      type: calculate_face_psnr
      better: higher
      crop_border: 0
      test_y_channel: false
      mask_threshold: 1
    face_ssim:
      type: calculate_face_ssim
      better: higher
      crop_border: 0
      test_y_channel: false
      mask_threshold: 1
    lpips:
      type: calculate_lpips
      better: lower
      crop_border: 0
      net: vgg
    # 【NICOLE2026】身份保真指标（ArcFace 余弦相似度，越高越不漂移）
    identity:
      type: calculate_identity
      better: higher
      crop_border: 0
# 【NICOLE2026】
