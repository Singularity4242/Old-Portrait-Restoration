name: test_MambaIRv2_ColorDN_level15
model_type: MambaIRv2Model
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  test_1:
    task: denoising_color
    name: CBSD68
    type: PairedImageDataset
    dataroot_gt: datasets/ColorDN/CBSD68HQ
    dataroot_lq: datasets/ColorDN/CBSD68HQ
    filename_tmpl: '{}'
    noise: 15 # 15/25/50
    io_backend:
      type: disk
